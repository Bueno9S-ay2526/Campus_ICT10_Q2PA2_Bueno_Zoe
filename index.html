<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!--Pyscript-->
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>

    <!-- Latest compiled and minified CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Latest compiled JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <title>PA 2: Gaming Club</title>
</head>
<body>
    <main style="background: rgb(84, 90, 167);margin: 0 auto; padding: 40px; width: 55%; text-align: center; line-height: 1.7; border-radius: 7px; margin-top: 45px; margin-bottom: 45px; height: 100%; flex: 1; min-height: 60vh">
        <h2>Welcomg to the Gaming Club!</h2>
        <form style="text-align: left; margin-top: 15px; margin-bottom: 10px;">
            <h5>Display Name:</h5>
            <input type="text" class="form-control" id="dis_name" placeholder="Input your display name"><br>
            <h5>Username:</h5>
            <input type="text" class="form-control" id="username" placeholder="Input your username">
        </form>
        <button class="btn btn-primary mt-3" type="submit" style="width: 30%; margin: auto;" py-click="add_member"><b>Get nickname</b></button>
        <div id="results"></div>
    </main>    
    <py-script src="main.py"></py-script>
</body>
</html>
